apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kibana
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://helm.elastic.co
    chart: kibana
    targetRevision: 8.5.1

    helm:
      values: |
        elasticsearchHosts: "https://elasticsearch-master.logging.svc.cluster.local:9200"

        resources:
          requests:
            cpu: 50m
            memory: 128Mi

          limits:
            cpu: 100m
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true