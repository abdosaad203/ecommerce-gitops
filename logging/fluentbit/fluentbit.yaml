apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: fluentbit
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.46.6

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true