apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/abdosaad203/ecommerce-gitops.git
    targetRevision: main
    path: argo-apps/production

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
