apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: frontend-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/abdosaad203/helm-frontend.git
    targetRevision: main
    path: frontend

    helm:
      valueFiles:
        - values/gitops-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true