apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: frontend-prod
  namespace: argocd

spec:
  project: default

  sources:

    - repoURL: https://github.com/abdosaad203/helm-frontend.git
      targetRevision: main
      path: frontend

      helm:
        valueFiles:
          - $values/environments/prod/ecommerce-ui.yaml

    - repoURL: https://github.com/abdosaad203/ecommerce-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true