apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: frontend
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/abdosaad203/helm-frontend.git
    targetRevision: main
    path: frontend

    helm:
      valueFiles:
        - ../../environments/stg/ecommerce-ui.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true