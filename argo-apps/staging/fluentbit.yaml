apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: fluentbit
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/abdosaad203/ecommerce-gitops.git
    targetRevision: main
    path: logging/fluentbit

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true