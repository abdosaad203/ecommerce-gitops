apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: policies
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/abdosaad203/ecommerce-gitops.git
    targetRevision: main
    path: policies

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true