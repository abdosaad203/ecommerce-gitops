apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-stack
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/abdosaad203/ecommerce-gitops.git
    targetRevision: main
    path: monitoring/prometheus

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true