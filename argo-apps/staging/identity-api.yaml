apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: identity-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/abdosaad203/helm-backend.git
    targetRevision: main
    path: backend

    helm:
      valueFiles:
        - ../../environments/stg/identity-api.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true