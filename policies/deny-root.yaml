apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-root-containers
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: require-non-root
      match:
        any:
        - resources:
            kinds:
            - Pod

      validate:
        message: "Running as root is not allowed"

        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
